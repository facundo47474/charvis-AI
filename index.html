<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CHARVIS</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg      : #080810;
      --surface : #0e0e1a;
      --border  : #1a1a2e;
      --accent  : #6c5ce7;
      --accent2 : #fd79a8;
      --cyan    : #00cec9;
      --text    : #dfe6e9;
      --muted   : #636e72;
      --success : #55efc4;
      --danger  : #ff7675;
      --user-bg : #13132a;
      --bot-bg  : #0e0e18;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      overflow: hidden;
    }

    /* ── Fondo animado ── */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 60% 40% at 20% 50%, rgba(108,92,231,.07) 0%, transparent 70%),
        radial-gradient(ellipse 50% 30% at 80% 20%, rgba(0,206,201,.05) 0%, transparent 70%);
      pointer-events: none;
    }

    #app {
      position: relative; z-index: 1;
      display: flex; flex-direction: column;
      height: 100vh; max-width: 560px;
      margin: 0 auto;
    }

    /* ── Header ── */
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 24px 14px;
      border-bottom: 1px solid var(--border);
      background: rgba(8,8,16,.8);
      backdrop-filter: blur(12px);
    }
    .logo-wrap { display: flex; align-items: center; gap: 12px; }
    .logo-mark {
      width: 32px; height: 32px;
      border: 1.5px solid var(--accent);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Syne', sans-serif;
      font-weight: 800; font-size: 14px;
      color: var(--accent);
      box-shadow: 0 0 12px rgba(108,92,231,.3);
    }
    .logo-text {
      font-family: 'Syne', sans-serif;
      font-weight: 800; font-size: 16px;
      letter-spacing: 4px;
      background: linear-gradient(135deg, var(--accent), var(--cyan));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .header-right { display: flex; align-items: center; gap: 10px; }

    /* ── Status ── */
    #status-bar {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 24px;
      font-size: 10px; letter-spacing: 1px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      background: rgba(8,8,16,.6);
    }
    #orb {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--muted); flex-shrink: 0;
      transition: all .3s;
    }
    #orb.escuchando { background: var(--success); box-shadow: 0 0 10px var(--success); animation: pulso 1.4s infinite; }
    #orb.transcribiendo { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
    #orb.pensando { background: var(--accent2); box-shadow: 0 0 10px var(--accent2); animation: pulso .8s infinite; }
    #orb.hablando { background: var(--cyan); box-shadow: 0 0 12px var(--cyan); animation: pulso .5s infinite; }
    #orb.error { background: var(--danger); }
    @keyframes pulso { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.5);opacity:.7} }

    /* ── Chat ── */
    #chat {
      flex: 1; overflow-y: auto;
      padding: 20px 20px;
      display: flex; flex-direction: column; gap: 14px;
      scroll-behavior: smooth;
    }
    #chat::-webkit-scrollbar { width: 3px; }
    #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .burbuja {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 13px; line-height: 1.65;
      animation: aparecer .2s ease-out;
    }
    @keyframes aparecer { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

    .burbuja.usuario {
      align-self: flex-end;
      background: var(--user-bg);
      border: 1px solid rgba(108,92,231,.4);
      border-bottom-right-radius: 4px;
    }
    .burbuja.charvis {
      align-self: flex-start;
      background: var(--bot-bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .burbuja .label {
      font-size: 8px; font-weight: 700;
      letter-spacing: 2px; margin-bottom: 5px;
      font-family: 'Syne', sans-serif;
    }
    .burbuja.usuario .label { color: var(--accent); text-align: right; }
    .burbuja.charvis .label { color: var(--cyan); }

    .burbuja.error-msg {
      align-self: center;
      background: rgba(255,118,117,.08);
      border: 1px solid var(--danger);
      color: var(--danger);
      font-size: 11px; border-radius: 8px;
    }

    /* ── Estado vacío ── */
    #empty {
      flex: 1; display: flex;
      flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; color: var(--border);
    }
    #empty .big {
      font-family: 'Syne', sans-serif;
      font-weight: 800; font-size: 64px;
      letter-spacing: 6px;
      background: linear-gradient(135deg, var(--border), rgba(108,92,231,.3));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    #empty .sub { font-size: 11px; color: var(--muted); letter-spacing: 2px; }

    /* ── Onda ── */
    #wave-container {
      display: flex; align-items: center; justify-content: center;
      gap: 3px; height: 44px; padding: 0 24px;
      border-top: 1px solid var(--border);
      background: rgba(8,8,16,.6);
    }
    .bar { width: 3px; border-radius: 3px; height: 4px; background: var(--accent); }
    .bar.active { animation: onda var(--d,.8s) ease-in-out infinite alternate; }
    @keyframes onda { from{height:4px} to{height:26px} }

    /* ── Controles ── */
    #controls {
      display: flex; gap: 10px;
      padding: 14px 20px 20px;
      background: rgba(8,8,16,.9);
      border-top: 1px solid var(--border);
    }
    .btn {
      flex: 1; padding: 11px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-family: 'Syne', sans-serif;
      font-size: 10px; font-weight: 700;
      letter-spacing: 1.5px; cursor: pointer;
      transition: all .2s;
    }
    .btn:hover { border-color: var(--accent); color: var(--text); }
    .btn.primary {
      background: linear-gradient(135deg, var(--accent), #4a3aad);
      border-color: var(--accent); color: #fff;
    }
    .btn.primary:hover { opacity: .85; }
    .btn.warn { border-color: var(--accent2); color: var(--accent2); }
    .btn.warn:hover { background: rgba(253,121,168,.1); }

    /* ── Mic error ── */
    #mic-error {
      display: none; text-align: center;
      padding: 20px; color: var(--danger); font-size: 12px; line-height: 1.8;
    }

    /* ── Conexión ── */
    #conn-badge {
      font-size: 9px; letter-spacing: 1px; padding: 3px 8px;
      border-radius: 20px; border: 1px solid;
      transition: all .3s;
    }
    #conn-badge.conectado { color: var(--success); border-color: var(--success); }
    #conn-badge.desconectado { color: var(--danger); border-color: var(--danger); }
  </style>
</head>
<body>
<div id="app">

  <header>
    <div class="logo-wrap">
      <div class="logo-mark">C</div>
      <span class="logo-text">CHARVIS</span>
    </div>
    <div class="header-right">
      <span id="conn-badge" class="desconectado">OFFLINE</span>
    </div>
  </header>

  <div id="status-bar">
    <div id="orb"></div>
    <span id="status-text">Conectando...</span>
  </div>

  <div id="chat">
    <div id="empty">
      <div class="big">C</div>
      <div class="sub">HABLÁ CUANDO ESTÉS LISTO</div>
    </div>
    <div id="mic-error">
      No se pudo acceder al micrófono.<br/>
      Permitir acceso en la configuración del navegador.
    </div>
  </div>

  <div id="wave-container"></div>

  <div id="controls">
    <button class="btn warn" onclick="limpiar()">NUEVA CHARLA</button>
    <button class="btn primary" id="btn-toggle" onclick="toggleEscucha()">DETENER</button>
  </div>

</div>
<script>
// ── WebSocket ────────────────────────────────────────────────
const WS_URL = (location.protocol === "https:" ? "wss://" : "ws://") + location.host;
let ws = null;
let wsReady = false;

function conectar() {
  ws = new WebSocket(WS_URL);
  ws.binaryType = "arraybuffer";

  ws.onopen = () => {
    wsReady = true;
    badge("conectado", "EN LÍNEA");
    aplicarEstado("escuchando");
    iniciarVAD();
  };

  ws.onclose = () => {
    wsReady = false;
    badge("desconectado", "OFFLINE");
    aplicarEstado("error");
    document.getElementById("status-text").textContent = "Reconectando...";
    setTimeout(conectar, 3000);
  };

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    switch(msg.type) {
      case "estado":       aplicarEstado(msg.valor); break;
      case "mensaje":      agregarMensaje(msg.rol, msg.texto); break;
      case "error":        aplicarEstado("error"); agregarError(msg.mensaje); break;
      case "limpiar":      limpiarChat(); break;
      case "reproducir":   encolarMP3(msg.data); break;
      case "hablar":       encolarVoz(msg.texto); break;
      case "streamTerminado": streamDone = true; playNext(); procesarCola(); break;
    }
  };
}
conectar();

function badge(cls, txt) {
  const b = document.getElementById("conn-badge");
  b.className = cls; b.textContent = txt;
}

function enviarAudio(data) {
  if (wsReady && ws.readyState === WebSocket.OPEN) ws.send(data);
}

function enviarControl(obj) {
  if (wsReady && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
}

// ── UI ───────────────────────────────────────────────────────
let activoUI = true;
const wc = document.getElementById("wave-container");
for(let i=0;i<22;i++){const b=document.createElement("div");b.className="bar";b.style.setProperty("--d",(0.4+Math.random()*0.7)+"s");b.style.animationDelay=(Math.random()*0.5)+"s";wc.appendChild(b);}

function setWave(on, color) {
  document.querySelectorAll(".bar").forEach(b => {
    b.classList.toggle("active", on);
    b.style.background = color || "var(--accent)";
  });
}

const ESTADOS = {
  escuchando    : { texto:"Escuchando...",           orb:"escuchando",    wave:true,  wcolor:"var(--success)" },
  transcribiendo: { texto:"Procesando voz...",       orb:"transcribiendo",wave:false },
  pensando      : { texto:"Charvis está pensando...",orb:"pensando",      wave:false },
  hablando      : { texto:"Charvis habla...",        orb:"hablando",      wave:true,  wcolor:"var(--cyan)" },
  detenido      : { texto:"Pausado",                 orb:"",              wave:false },
  error         : { texto:"Error de conexión",       orb:"error",         wave:false },
};

let isHablando = false;

function aplicarEstado(n) {
  const e = ESTADOS[n] || ESTADOS.escuchando;
  document.getElementById("status-text").textContent = e.texto;
  document.getElementById("orb").className = e.orb || "";
  setWave(e.wave || false, e.wcolor);
  isHablando = (n === "hablando");
}

function agregarMensaje(rol, texto) {
  document.getElementById("empty")?.remove();
  const chat = document.getElementById("chat");
  const div = document.createElement("div");
  div.className = "burbuja " + rol;
  const label = document.createElement("div");
  label.className = "label";
  label.textContent = rol === "usuario" ? "VOS" : "CHARVIS";
  const content = document.createElement("div");
  content.textContent = texto;
  div.appendChild(label); div.appendChild(content);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function agregarError(texto) {
  const chat = document.getElementById("chat");
  const div = document.createElement("div");
  div.className = "burbuja error-msg";
  div.textContent = "⚠ " + texto;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function limpiarChat() {
  document.getElementById("chat").innerHTML =
    '<div id="empty"><div class="big">C</div><div class="sub">HABLÁ CUANDO ESTÉS LISTO</div></div>';
}

function toggleEscucha() {
  const btn = document.getElementById("btn-toggle");
  activoUI = !activoUI;
  btn.textContent = activoUI ? "DETENER" : "INICIAR";
  btn.classList.toggle("primary", activoUI);
  if (!activoUI) detenerAudio();
}

function limpiar() {
  detenerAudio();
  enviarControl({ type: "limpiar" });
}

// ── Audio Playback (ElevenLabs MP3) ─────────────────────────
let audioQueue = [];
let playingAudio = false;
let streamDone = false;
let currentAudio = null;

function encolarMP3(base64) {
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
  const blob = new Blob([bytes], { type:"audio/mpeg" });
  audioQueue.push(URL.createObjectURL(blob));
  playNext();
}

function playNext() {
  if (playingAudio || audioQueue.length === 0) {
    if (!playingAudio && audioQueue.length === 0 && streamDone) {
      streamDone = false;
      vozTerminada();
    }
    return;
  }
  playingAudio = true;
  const src = audioQueue.shift();
  currentAudio = new Audio(src);
  currentAudio.onended = () => { URL.revokeObjectURL(src); playingAudio=false; currentAudio=null; playNext(); };
  currentAudio.onerror = () => { playingAudio=false; currentAudio=null; playNext(); };
  currentAudio.play().catch(() => { playingAudio=false; playNext(); });
}

// ── Fallback Web Speech API ──────────────────────────────────
const colaVoz = [];
let hablando = false;

function encolarVoz(texto) { colaVoz.push(texto); procesarCola(); }

function procesarCola() {
  if (hablando || colaVoz.length === 0) {
    if (!hablando && colaVoz.length === 0 && streamDone) {
      streamDone = false;
      vozTerminada();
    }
    return;
  }
  hablando = true;
  const utter = new SpeechSynthesisUtterance(colaVoz.shift());
  utter.lang = "es-AR"; utter.rate = 1.1; utter.pitch = 0.8;
  utter.onend  = () => { hablando=false; procesarCola(); };
  utter.onerror = () => { hablando=false; procesarCola(); };
  window.speechSynthesis.speak(utter);
}

function vozTerminada() {
  aplicarEstado("escuchando");
}

function detenerAudio() {
  if (currentAudio) { currentAudio.pause(); currentAudio=null; }
  audioQueue.forEach(s => URL.revokeObjectURL(s));
  audioQueue = []; playingAudio = false; streamDone = false;
  window.speechSynthesis.cancel();
  colaVoz.length = 0; hablando = false;
}

// ── VAD + MediaRecorder ──────────────────────────────────────
let analyser       = null;
let mediaRecorder  = null;
let audioChunks    = [];
let isRecording    = false;
let silenceTimer   = null;
let vadInterval    = null;

const VOICE_THRESHOLD     = 0.022;
const INTERRUPT_THRESHOLD = 0.04;
const SILENCE_MS          = 1500;

async function iniciarVAD() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio:true, video:false });
    const audioCtx = new AudioContext();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    audioCtx.createMediaStreamSource(stream).connect(analyser);

    // Elegir mejor mimeType disponible
    const mimeType = ["audio/webm;codecs=opus","audio/webm","audio/ogg"].find(m => MediaRecorder.isTypeSupported(m)) || "";
    mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : {});
    mediaRecorder.ondataavailable = e => { if(e.data.size>0) audioChunks.push(e.data); };
    mediaRecorder.onstop = async () => {
      if(!activoUI || !wsReady) return;
      const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType });
      audioChunks = [];
      const buf = await blob.arrayBuffer();
      if (buf.byteLength > 2000) enviarAudio(buf);
      else aplicarEstado("escuchando");
    };

    const dataArray = new Uint8Array(analyser.frequencyBinCount);

    vadInterval = setInterval(() => {
      if (!activoUI || !wsReady) return;
      analyser.getByteTimeDomainData(dataArray);
      const rms = Math.sqrt(dataArray.reduce((s,v) => s+(v-128)**2, 0) / dataArray.length) / 128;

      // Interrumpir si Charvis habla y el usuario habla fuerte
      if (isHablando && rms > INTERRUPT_THRESHOLD) {
        detenerAudio();
        aplicarEstado("escuchando");
        comenzarGrabacion();
        return;
      }

      if (!isHablando) {
        if (rms > VOICE_THRESHOLD && !isRecording) {
          comenzarGrabacion();
        } else if (rms < VOICE_THRESHOLD && isRecording) {
          if (!silenceTimer) silenceTimer = setTimeout(() => { detenerGrabacion(); silenceTimer=null; }, SILENCE_MS);
        } else if (rms > VOICE_THRESHOLD && isRecording && silenceTimer) {
          clearTimeout(silenceTimer); silenceTimer=null;
        }
      }
    }, 100);

  } catch(err) {
    console.error("[MIC]", err.message);
    document.getElementById("mic-error").style.display = "block";
    document.getElementById("empty")?.remove();
  }
}

function comenzarGrabacion() {
  if (isRecording || !mediaRecorder) return;
  isRecording = true; audioChunks = [];
  mediaRecorder.start();
}

function detenerGrabacion() {
  if (!isRecording || !mediaRecorder) return;
  isRecording = false;
  if (mediaRecorder.state === "recording") mediaRecorder.stop();
}
</script>
</body>
</html>
