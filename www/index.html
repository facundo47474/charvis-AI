<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Charvis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <aside id="sidebar">
    <div class="sidebar-top">
      <button id="btn-new-chat" class="sidebar-btn" onclick="limpiar()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <span>Nueva conversación</span>
      </button>
    </div>
    <div class="sidebar-history" id="sidebar-history"></div>
    <div class="sidebar-bottom">
      <div class="sidebar-user">
        <div class="user-avatar">U</div>
        <span class="user-name">Usuario</span>
      </div>
    </div>
  </aside>

  <div id="main">
    <header id="topbar">
      <button id="btn-sidebar-toggle" class="icon-btn" onclick="toggleSidebar()" title="Menú">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>

      <div id="model-selector">
        <button id="model-btn" onclick="toggleModelDropdown()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>
          <span id="model-name">Charvis 1.0 Beta</span>
          <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div id="model-dropdown" class="dropdown hidden">
          <div class="dropdown-item active" onclick="selectModel('Charvis 1.0 Beta')">
            <div class="model-info">
              <span class="model-item-name">Charvis 1.0 Beta</span>
              <span class="model-item-desc">Modelo principal — rápido y conversacional</span>
            </div>
            <svg class="check-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
        </div>
      </div>

      <div class="topbar-right">
        <button id="btn-auto-speak" class="icon-btn active" onclick="toggleAutoSpeak()" title="Audio automático activado">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        </button>
        <div id="conn-indicator">
          <span id="conn-dot"></span>
          <span id="conn-text">Conectando</span>
        </div>
      </div>
    </header>

    <main id="chat">
      <div id="welcome-screen">
        <div class="welcome-logo">C</div>
        <h1 class="welcome-heading">¿En qué puedo ayudarte?</h1>
        <div class="welcome-grid">
          <button class="suggestion-card" onclick="insertSuggestion('Explicame qué podés hacer')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            <span>Explicame qué podés hacer</span>
          </button>
          <button class="suggestion-card" onclick="insertSuggestion('Ayudame a escribir un email profesional')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <span>Ayudame a escribir un email</span>
          </button>
        </div>
      </div>
    </main>

    <div id="input-section">
      <div id="file-preview" class="hidden">
        <div class="file-chip">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          <span id="file-name"></span>
          <button class="file-remove-btn" onclick="removeFile()">✕</button>
        </div>
      </div>

      <div id="input-box">
        <button id="btn-attach" class="input-icon-btn" onclick="document.getElementById('file-input').click()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        </button>
        <input type="file" id="file-input" hidden/>
        <textarea id="text-input" placeholder="Enviá un mensaje a Charvis..." rows="1" onkeydown="handleKeyDown(event)" oninput="autoResize(this)"></textarea>
        <button id="btn-mic" class="input-icon-btn" onclick="toggleMic()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="1" width="6" height="11" rx="3"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        </button>
        <button id="btn-send" class="send-btn hidden" onclick="enviarTexto()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
      <p class="input-disclaimer">Charvis 1.0 Beta puede cometer errores. Verificá la información importante.</p>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
