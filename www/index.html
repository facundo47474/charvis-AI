<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Charvis</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body class="welcome-active">
  <div id="app">
    <aside id="sidebar" aria-label="Menú lateral">
      <div class="sidebar-top">
        <button id="btn-new-chat" class="sidebar-btn" type="button" onclick="nuevaConversacion()">
          <span class="sidebar-plus">+</span>
          <span>Nueva conversación</span>
        </button>

        <button id="btn-sidebar-close" class="sidebar-close-btn" type="button" onclick="cerrarSidebar()" title="Cerrar menú">
          ×
        </button>
      </div>

      <div class="sidebar-section-title">Conversaciones</div>

      <div id="sidebar-history" class="sidebar-history"></div>

      <div class="sidebar-user">
        <div class="avatar">A</div>
        <span>Creador Arguello</span>
      </div>
    </aside>

    <div id="sidebar-backdrop" aria-hidden="true"></div>

    <main id="main">
      <header id="topbar">
        <div class="topbar-left">
          <button id="menu-toggle" type="button" onclick="toggleSidebar()" aria-label="Abrir menú">
            ☰
          </button>

          <div class="brand-badge" aria-hidden="true">
            ⛓
          </div>

          <div class="topbar-title">
            <strong>Charvis</strong>
            <span id="active-mode-label">Modo normal</span>
          </div>
        </div>

        <div class="topbar-right">
          <button id="audio-toggle" type="button" onclick="accionProximamente('Audio')" title="Audio">
            ◉
          </button>

          <div id="connection-status" class="connection-status">
            <span class="status-dot"></span>
            <span>Conectado</span>
          </div>
        </div>
      </header>

      <section id="chat" aria-live="polite"></section>

      <form id="composer" class="composer" onsubmit="enviarMensaje(event)">
        <div class="composer-shell">
          <button
            type="button"
            class="composer-tool"
            onclick="document.getElementById('file-input').click()"
            title="Adjuntar archivo"
            aria-label="Adjuntar archivo"
          >
            +
          </button>

          <textarea
            id="message-input"
            placeholder="Escribí tu mensaje..."
            rows="1"
            autocomplete="off"
            spellcheck="false"
            wrap="soft"
            oninput="autoResizeTextarea(this); sincronizarHeroInput(this.value)"
          ></textarea>

          <button
            type="button"
            id="reasoning-toggle"
            class="reasoning-toggle"
            onclick="toggleModoRazonamiento()"
          >
            Normal
          </button>

          <button id="send-button" type="submit" title="Enviar mensaje" aria-label="Enviar mensaje">
            ↑
          </button>
        </div>
      </form>
    </main>
  </div>

  <input type="file" id="file-input" style="display:none;" multiple accept=".txt,.js,.html,.css,.json,.md,.pdf,.png,.jpg,.jpeg,.webp" onchange="handleFiles(this.files)">

  <script src="app.js"></script>
</body>
</html>
